<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A short description of this post.">
    <title>Post Title — Matthew Kersting</title>

    <link rel="stylesheet" href="../../css/style.css">

    <style>
        .post {
            max-width: 720px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            line-height: 1.75;
        }

        .post-header {
            margin-bottom: 3rem;
        }

        .post-date {
            color: #888;
            font-size: 0.9rem;
        }

        .post-title {
            margin-top: 0.5rem;
            line-height: 1.2;
        }

        .post-content h2,
        .post-content h3 {
            margin-top: 2.5rem;
        }

        .post-content p {
            margin: 1.25rem 0;
        }

        .post-content img {
            max-width: 100%;
            height: auto;
        }

        .post-content blockquote {
            border-left: 3px solid #ccc;
            padding-left: 1.25rem;
            color: #777;
            margin: 2rem 0;
        }

        .post-content pre {
            overflow-x: auto;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 4px;
        }

        .post-content code {
            font-family: monospace;
        }

        .post-footer {
            margin-top: 4rem;
            padding-top: 1.5rem;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <!-- Keep your existing site navigation here -->

    <main class="post">

        <header class="post-header">
            <a href="../blog.html">&larr; Back to posts</a>

            <p class="post-date">October 22, 2026</p>

            <h1 class="post-title">Post Title</h1>
        </header>

        <article class="post-content">

            <p>
                Start writing here.
            </p>

            <h2>A Section Heading</h2>

            <p>
                Your content goes here. Write whatever you want using
                regular HTML elements.
            </p>

            <blockquote>
                An interesting quote or thought.
            </blockquote>

            <h2>Another Section</h2>

            <p>
                More writing...
            </p>

        </article>

        <footer class="post-footer">
            <a href="../blog.html">&larr; Back to posts</a>
        </footer>

    </main>

</body>
</html>
